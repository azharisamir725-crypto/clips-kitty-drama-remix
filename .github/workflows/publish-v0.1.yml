name: Publish Drama Remix fixed build fast

on:
  push:
    branches:
      - release/package-v0.1
    paths:
      - ".github/workflows/publish-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-fixed-build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Stream fixed artifact directly
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $url = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10575341499/zip"
          curl.exe -L --fail --retry 5 --retry-delay 5 -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" $url -o fixed-artifact.zip
          if ($LASTEXITCODE -ne 0) { throw "Direct artifact download failed" }
          tar.exe -xf fixed-artifact.zip -C package
          if ($LASTEXITCODE -ne 0) { throw "Artifact extraction failed" }

      - name: Build bootstrap installer
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          & $csc /nologo /target:winexe /optimize+ /out:bootstrap\DramaRemix-Setup.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Net.Http.dll /reference:System.Windows.Forms.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:Microsoft.CSharp.dll bootstrap\DramaRemixSetup.cs
          if (-not (Test-Path bootstrap\DramaRemix-Setup.exe)) { throw "Setup exe was not built" }

      - name: Verify fixed package parts
        shell: pwsh
        run: |
          $parts = Get-ChildItem package -Filter "DramaRemix.part*" | Sort-Object Name
          if ($parts.Count -ne 4) {
            $parts | Format-Table Name, Length
            throw "Expected 4 package parts, found $($parts.Count)"
          }
          $parts | Format-Table Name, Length

      - name: Replace release assets with fixed build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 *> $null
          if ($LASTEXITCODE -ne 0) { throw "Release v0.1.0 does not exist" }
          gh release upload v0.1.0 bootstrap\DramaRemix-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "Installer upload failed" }
          Get-ChildItem package -Filter "DramaRemix.part*" | Sort-Object Name | ForEach-Object {
            gh release upload v0.1.0 $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $($_.Name)" }
          }

      - name: Publish fixed-build manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $parts = Get-ChildItem package -Filter "DramaRemix.part*" | Sort-Object Name
          $lines = @(
            "Drama Remix v0.1.0 fixed",
            "Source build run: 35400094435",
            "FFmpeg 9 compatibility: -fps_mode",
            ""
          )
          foreach ($p in $parts) {
            $hash = (Get-FileHash $p.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$($p.Name)  $($p.Length) bytes  sha256:$hash"
          }
          $lines | Set-Content -Encoding UTF8 release-manifest.txt
          gh release upload v0.1.0 release-manifest.txt --clobber
