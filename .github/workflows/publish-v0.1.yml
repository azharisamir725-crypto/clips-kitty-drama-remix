name: Publish Drama Remix installer

on:
  push:
    branches:
      - release/package-v0.1
    paths:
      - "bootstrap/**"
      - ".github/workflows/publish-v0.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Build bootstrap installer
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found" }
          & $csc /nologo /target:winexe /optimize+ /out:bootstrap\DramaRemix-Setup.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Net.Http.dll /reference:System.Windows.Forms.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll /reference:Microsoft.CSharp.dll bootstrap\DramaRemixSetup.cs
          if (-not (Test-Path bootstrap\DramaRemix-Setup.exe)) { throw "Setup exe was not built" }

      - name: Replace installer in existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 *> $null
          if ($LASTEXITCODE -ne 0) { throw "Release v0.1.0 does not exist" }
          gh release upload v0.1.0 bootstrap\DramaRemix-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "Installer upload failed" }
